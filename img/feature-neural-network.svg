    <circle cx="122" cy="121" r="7.5" fill="url(#green)"/>
    <circle cx="122" cy="172" r="7.5" fill="url(#cyan)"/>
    <circle cx="144" cy="69" r="7.5" fill="url(#violet)"/>
    <circle cx="144" cy="108" r="7.5" fill="url(#cyan)"/>
    <circle cx="144" cy="176" r="7.5" fill="url(#violet)"/>
    <circle cx="164" cy="91" r="7.5" fill="url(#green)"/>
