    <circle cx="235" cy="73" r="5.2" fill="#66eef7"/>
    <circle cx="239" cy="142" r="5.2" fill="#a7ff8d"/>
    <circle cx="239" cy="164" r="5.2" fill="#9ba9ff"/>
