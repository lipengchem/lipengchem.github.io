  <g opacity="0.7">
    <path d="M203 78h22" stroke="#a4f2f8" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M203 96h31" stroke="#9cffbd" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M203 114h20" stroke="#adb6ff" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="196" cy="78" r="3" fill="#a4f2f8"/>
    <circle cx="196" cy="96" r="3" fill="#9cffbd"/>
